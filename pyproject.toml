[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bipartite-scope"
version = "4.0.0"
description = "An explainable bipartite recommendation service with reliable local operations."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Dongxuan Ge"}]
keywords = ["bipartite-graphs", "community-search", "graph-learning", "explainability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
train = ["torch>=2.2"]
api = ["fastapi>=0.115", "pydantic>=2.4", "python-multipart>=0.0.9", "uvicorn>=0.30"]
service = [
  "alembic>=1.13",
  "celery[redis]>=5.4",
  "fastapi>=0.115",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "redis>=5.0",
  "sqlalchemy>=2.0",
  "uvicorn>=0.30",
]
dev = ["build>=1.2", "httpx>=0.27", "pytest>=8", "ruff>=0.5"]

[project.scripts]
bipartite-scope = "bipartite_scope.interface:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/bipartite-scope" = ["alembic.ini"]
"share/bipartite-scope/migrations" = ["migrations/env.py"]
"share/bipartite-scope/migrations/versions" = [
  "migrations/versions/0001_v3_control_plane.py",
  "migrations/versions/0002_v4_operations.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
